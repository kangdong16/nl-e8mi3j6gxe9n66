<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>데일리 마케팅 뉴스레터 아카이브</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* Layout: neon-violet trend-magazine band (discovery mark · headline · thumbnail · POINT) → category rows of image cards → archive lists with black-ruled rows + 더보기
   Single deliberate light look (neon violet / ink / paper / orange sticker), so no dark variant. */
:root {
  color-scheme: light;
  --neon: #9B4DFF;          /* 형광 보라 (메인) */
  --neon-deep: #6A4BFF;     /* 블루 바이올렛 (그라데이션 끝) */
  --neon-pink: #C86BFF;     /* 핑크 바이올렛 (그라데이션 시작) */
  --neon-soft: #D9BBFF;     /* 하이라이트·흰 바탕 위 강조 */
  --neon-glow: #E9DAFF;     /* 검정 바탕 위 강조 글씨 */
  --hero-bg: linear-gradient(135deg, var(--neon-pink) 0%, var(--neon) 45%, var(--neon-deep) 100%);
  --ink: #0F0F0F;
  --paper: #F6F5F1;
  --white: #FFFFFF;
  --gray: #7A7A76;
  --rule: #D9D8D2;
  --orange: #FF6000;
  --orange-soft: #FFEBDD;
  --focus: #FF6000;
  --f: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
* { box-sizing: border-box; }
body { background: var(--white); color: var(--ink); font-family: var(--f); font-size: 15px; line-height: 1.6; word-break: keep-all; overflow-wrap: break-word; }
a { color: inherit; text-decoration: none; }
a:focus-visible, button:focus-visible, input:focus-visible, summary:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.wrap { max-width: 1200px; margin: 0 auto; padding-inline: 16px; }
.tnum { font-variant-numeric: tabular-nums; }

/* top utility strip */
.util { background: var(--ink); color: var(--white); font-size: 12px; }
.util .wrap { display: flex; gap: 20px; align-items: center; justify-content: space-between; min-height: 36px; flex-wrap: wrap; }
.util nav { display: flex; gap: 18px; flex-wrap: wrap; }
.util nav a { opacity: .85; font-weight: 500; }
.util nav a:hover { opacity: 1; color: var(--neon-glow); }

/* sticky neon-violet bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--hero-bg); color: var(--white); border-bottom: 1px solid var(--ink); }
.bar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 64px; flex-wrap: wrap; padding-block: 10px; }
.mark { font-weight: 900; font-size: 20px; letter-spacing: -0.8px; line-height: 1.1; }
.mark small { display: block; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; }
.search { display: flex; align-items: center; background: var(--ink); border-radius: 999px; padding: 4px 6px 4px 16px; width: min(340px, 100%); }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--white); font: inherit; font-size: 13px; padding: 6px 0; }
.search input::placeholder { color: #cfcfcf; }
.search input:focus-visible { outline: none; }
.search:focus-within { outline: 3px solid var(--orange); outline-offset: 2px; }
.search svg { flex: none; margin-right: 8px; }

/* hero */
.hero { background: var(--hero-bg); color: var(--white); padding-block: 36px 0; overflow: hidden; }
.viewport { overflow: hidden; touch-action: pan-y; cursor: grab; user-select: none; }
.viewport.dragging { cursor: grabbing; }
.track { display: flex; transition: transform .55s cubic-bezier(.2,.7,.2,1); will-change: transform; }
.viewport.dragging .track { transition: none; }
/* PC: 왼쪽 16:9 썸네일 / 오른쪽 위 헤드라인, 아래 POINT */
.slide { flex: 0 0 100%; min-width: 0; overflow: hidden; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); grid-template-areas: "img q" "img p"; column-gap: 40px; row-gap: 22px; padding-block: 18px 32px; padding-left: 24px; }
.slide img { -webkit-user-drag: none; pointer-events: none; }
.hero-nav { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 14px 18px; border-top: 1px solid rgba(255,255,255,.55); flex-wrap: wrap; }
.ctrl { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 700; }
.ctrl button { width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid var(--ink); background: var(--white); cursor: pointer; display: grid; place-items: center; padding: 0; }
.ctrl button:hover { background: var(--ink); }
.ctrl button:hover path { stroke: var(--neon-glow); }
.ctrl .count { min-width: 56px; text-align: center; }
.dots { display: flex; gap: 6px; }
.dots button { width: 8px; height: 8px; border-radius: 999px; border: 0; padding: 0; background: rgba(255,255,255,.45); cursor: pointer; transition: width .3s; }
.dots button[aria-current="true"] { width: 22px; background: var(--white); }
.hero-q { grid-area: q; align-self: end; min-width: 0; }
/* 새로운 발견 마크: 큰 4갈래 반짝임 + 작은 반짝임 */
.hero-q .qm { display: block; width: 46px; height: 46px; margin-bottom: 10px; }
.hero-q .qm svg { width: 100%; height: 100%; display: block; overflow: visible; }
@media (prefers-reduced-motion: no-preference) {
  .hero-q .qm .s1 { transform-origin: 22px 24px; animation: twinkle 2.4s ease-in-out infinite; }
  .hero-q .qm .s2 { transform-origin: 39px 7px; animation: twinkle 2.4s ease-in-out 1.2s infinite; }
}
@keyframes twinkle { 0%, 100% { transform: scale(1); } 50% { transform: scale(.82); } }
.hero-q .kicker { display: inline-block; font-size: 13px; font-weight: 700; margin-bottom: 10px; border-bottom: 2px solid var(--white); }
.hero-q h1 { margin: 0; font-size: clamp(26px, 3vw, 36px); font-weight: 900; line-height: 1.3; letter-spacing: -1px; word-break: keep-all; overflow-wrap: break-word; text-wrap: balance; }
/* 문맥 줄바꿈: 쉼표·말줄임 등 의미 단위로 나눈 각 줄. 줄 안에서 다시 넘칠 때도 균형 맞춤 */
.hero-q h1 .ln { display: block; text-wrap: balance; }
.hero-q h1 a:hover { text-decoration: underline; text-decoration-thickness: 3px; text-underline-offset: 6px; }
.hero-img { grid-area: img; position: relative; align-self: center; min-width: 0; }
.hero-img .frame { width: 100%; aspect-ratio: 16 / 9; background: var(--white); border: 1.5px solid var(--white); overflow: hidden; display: block; box-shadow: 0 18px 40px rgba(40, 10, 110, .35); }
.hero-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.sticker { position: absolute; top: -10px; left: -22px; width: 92px; height: 92px; border-radius: 50%; background: var(--orange); color: var(--white); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; transform: rotate(-14deg); font-weight: 900; line-height: 1; box-shadow: 0 0 0 3px var(--white), 0 8px 18px rgba(40, 10, 110, .35); }
.sticker b { font-size: 27px; font-weight: 900; letter-spacing: 1px; }
.hero-p { grid-area: p; align-self: start; min-width: 0; max-width: 560px; }
.hero-p .lbl { font-size: 12px; font-weight: 900; letter-spacing: 2px; color: var(--orange); background: var(--ink); padding: 2px 8px; display: inline-block; margin-bottom: 10px; }
.hero-p p { margin: 0; font-size: 20px; font-weight: 700; line-height: 1.45; border-bottom: 2px solid var(--white); padding-bottom: 10px; text-wrap: balance; }
.stats { display: flex; gap: 16px; font-size: 12px; font-weight: 700; }

/* sections */
.sec { padding-block: 56px 0; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px 24px; flex-wrap: wrap; margin-bottom: 22px; }
.sec-head h2 { margin: 0; font-size: 26px; font-weight: 900; letter-spacing: -0.8px; }
.sec-head h2 em { font-style: normal; background: linear-gradient(transparent 58%, var(--neon-soft) 58%); }
.sec-head .meta { color: var(--gray); font-size: 13px; }

.cat-row { display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: 24px; padding-block: 24px; border-top: 2px solid var(--ink); }
.cat-row:last-child { border-bottom: 2px solid var(--ink); }
.cat-name { display: flex; flex-direction: column; gap: 6px; }
.cat-name h3 { margin: 0; font-size: 20px; font-weight: 900; letter-spacing: -0.5px; }
.cat-name span { font-size: 12px; color: var(--gray); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 24px; }
.card { display: grid; gap: 10px; align-content: start; min-width: 0; }
.thumb { display: block; aspect-ratio: 16 / 9; max-width: 100%; background: var(--paper); border: 1px solid var(--ink); overflow: hidden; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .3s ease; }
.card:hover .thumb img { transform: scale(1.03); }
.thumb .ph { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; text-align: center; color: var(--gray); font-size: 12px; padding: 8px; }
.pill { justify-self: start; font-size: 11px; font-weight: 700; background: var(--ink); color: var(--neon-glow); padding: 3px 10px; border-radius: 999px; }
.card h4 { margin: 0; font-size: 17px; font-weight: 700; line-height: 1.45; letter-spacing: -0.3px; text-wrap: balance; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card h4 a:hover { text-decoration: underline; text-underline-offset: 3px; }
.card .sum { margin: 0; color: #4a4a47; font-size: 14px; }
.point { display: flex; gap: 10px; align-items: baseline; background: var(--paper); padding: 8px 12px; font-size: 14px; font-weight: 500; }
.point b { flex: none; font-size: 11px; font-weight: 900; letter-spacing: 1px; color: var(--orange); }
.date { font-size: 12px; color: var(--gray); }

/* archive */
.arch { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 520px), 1fr)); gap: 32px 40px; }
.box { border-top: 2px solid var(--ink); min-width: 0; }
.box > header { display: flex; justify-content: space-between; align-items: baseline; padding-block: 14px 8px; }
.box > header h3 { margin: 0; font-size: 18px; font-weight: 900; }
.box > header span { font-size: 12px; color: var(--gray); }
.row { display: grid; grid-template-columns: 82px minmax(0, 1fr); gap: 4px 16px; padding-block: 14px; border-top: 1px solid var(--rule); }
.row .date { padding-top: 3px; }
.row h4 { margin: 0; font-size: 15px; font-weight: 700; line-height: 1.5; }
.row h4 a:hover { text-decoration: underline; text-underline-offset: 3px; }
.row .point { grid-column: 2; font-size: 13px; padding: 6px 10px; }
details.more { border-top: 1px solid var(--rule); }
details.more summary { cursor: pointer; list-style: none; display: flex; justify-content: center; padding-block: 14px; }
details.more summary::-webkit-details-marker { display: none; }
details.more summary span { border: 1px solid var(--ink); font-size: 13px; font-weight: 700; padding: 6px 18px; background: var(--white); }
details.more summary:hover span { background: var(--neon-soft); }
details.more[open] summary span::after { content: " 접기"; }
.heads { list-style: none; margin: 0; padding: 0 0 8px; }
.heads li { display: grid; grid-template-columns: 82px minmax(0, 1fr); gap: 16px; padding-block: 8px; border-top: 1px dashed var(--rule); font-size: 14px; }
.heads a:hover { text-decoration: underline; }

.results { border-top: 2px solid var(--ink); }
.results .heads li { grid-template-columns: 82px 88px minmax(0, 1fr); }
.results .tag { font-size: 12px; font-weight: 700; }
.results p { margin: 0; padding-block: 14px; font-weight: 700; }

.state { border: 1px dashed var(--ink); background: var(--paper); padding: 32px 20px; text-align: center; color: var(--gray); }
footer { margin-top: 64px; background: var(--ink); color: #cfcfcf; font-size: 13px; padding-block: 28px 36px; }
footer p { margin: 0; line-height: 1.8; }
footer a { color: var(--neon-glow); text-decoration: underline; text-underline-offset: 3px; }

@media (max-width: 860px) {
  .slide { grid-template-columns: 1fr; grid-template-areas: "q" "img" "p"; align-items: start; gap: 18px; padding: 14px 0 20px; }
  .hero-p { max-width: none; }
  .hero-img { max-width: 360px; width: calc(100% - 24px); margin-left: 24px; }
  .cat-row { grid-template-columns: 1fr; gap: 12px; }
}
@media (max-width: 520px) {
  .row, .heads li, .results .heads li { grid-template-columns: 1fr; gap: 2px; }
  .row .point { grid-column: 1; }
}
@media (prefers-reduced-motion: reduce) { .thumb img { transition: none; } }

/* 유튜브 급상승: 한국/해외 탭 → 일반 영상·쇼츠 각 TOP10, 한 화면에 3개씩 가로 스와이프 */
.yt-tabs { display: flex; gap: 8px; margin-bottom: 8px; }
.yt-tabs button { font: inherit; font-size: 14px; font-weight: 700; padding: 8px 20px; border-radius: 999px; border: 1.5px solid var(--ink); background: var(--white); color: var(--ink); cursor: pointer; }
.yt-tabs button[aria-selected="true"] { background: var(--ink); color: var(--neon-glow); }
.yt-block { border-top: 2px solid var(--ink); padding-block: 18px 8px; margin-top: 16px; min-width: 0; }
.yt-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.yt-head h3 { margin: 0; font-size: 20px; font-weight: 900; letter-spacing: -0.5px; }
.yt-head h3 span { font-size: 12px; font-weight: 500; color: var(--gray); margin-left: 8px; letter-spacing: 0; }
.yt-rail { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior-x: contain; }
.yt-rail::-webkit-scrollbar { display: none; }
.yt-page { flex: 0 0 100%; min-width: 0; scroll-snap-align: start; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; padding-right: 24px; }
.yt-page:last-child { padding-right: 0; }
.cat-row > .yt-rail { min-width: 0; }
.cat-name .ctrl { margin-top: 8px; }
.yt-card { display: grid; gap: 8px; align-content: start; min-width: 0; }
.yt-card .thumb { position: relative; }
.yt-rank { position: absolute; left: 0; top: 0; min-width: 40px; padding: 4px 10px; background: var(--ink); color: var(--neon-glow); font-weight: 900; font-size: 18px; line-height: 1.2; text-align: center; }
.yt-card.top .yt-rank { background: var(--orange); color: var(--white); }
.yt-dur { position: absolute; right: 6px; bottom: 6px; background: rgba(15,15,15,.85); color: var(--white); font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 4px; }
.yt-card h4 { margin: 0; font-size: 15px; font-weight: 700; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.yt-card h4 a:hover { text-decoration: underline; text-underline-offset: 3px; }
.yt-ch { font-size: 13px; color: #4a4a47; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.yt-stat { font-size: 12px; color: var(--gray); }
.yt-stat b { color: var(--ink); font-size: 14px; }
.yt-empty { color: var(--gray); font-size: 14px; padding-block: 12px; }
@media (max-width: 640px) {
  .yt-page { grid-template-columns: 1fr; gap: 14px; padding-right: 16px; }
  .yt-card { grid-template-columns: 136px minmax(0, 1fr); column-gap: 12px; row-gap: 2px; }
  .yt-card .thumb { grid-row: span 3; align-self: start; }
  .yt-rank { min-width: 30px; font-size: 14px; padding: 2px 6px; }
}
</style>
</head>
<body>

<div class="util">
  <div class="wrap">
    <nav aria-label="바로가기">
      <a href="#latest-sec">최신호</a>
      <a href="#yt-sec">유튜브 급상승</a>
      <a href="#archive-sec">지난 뉴스레터</a>
    </nav>
    <span>국내/해외 게임 · 이색 마케팅 · AI 기술</span>
  </div>
</div>

<div class="bar">
  <div class="wrap">
    <div class="mark">Daily Marketing<small>NEWSLETTER ARCHIVE</small></div>
    <label class="search" for="q">
      <input id="q" type="search" placeholder="검색어를 입력해 보세요." autocomplete="off" aria-label="기사 검색">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="#E9DAFF" stroke-width="2"/><path d="M11 11l3.5 3.5" stroke="#E9DAFF" stroke-width="2" stroke-linecap="round"/></svg>
    </label>
  </div>
</div>

<section class="hero" aria-roledescription="carousel" aria-label="최신호 기사 롤링">
  <div class="wrap">
    <div class="viewport" id="viewport">
      <div class="track" id="track" aria-live="off">
        <div class="slide"><div class="hero-q"><h1>뉴스레터를 불러오는 중입니다</h1></div></div>
      </div>
    </div>
    <div class="hero-nav">
      <div class="stats tnum"><span id="statIssues">–</span><span id="statItems">–</span><span id="statSince">–</span></div>
      <div class="dots" id="dots" role="group" aria-label="슬라이드 선택"></div>
      <div class="ctrl">
        <button type="button" id="prev" aria-label="이전 기사"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M8.5 2.5L4 7l4.5 4.5" fill="none" stroke="#0F0F0F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <span class="count tnum" id="count">– / –</span>
        <button type="button" id="next" aria-label="다음 기사"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M5.5 2.5L10 7l-4.5 4.5" fill="none" stroke="#0F0F0F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
    </div>
  </div>
</section>

<main class="wrap">
  <div id="results" hidden></div>

  <section class="sec" id="latest-sec" aria-labelledby="latestTitle">
    <div class="sec-head">
      <h2 id="latestTitle"><em>오늘의 뉴스레터</em></h2>
      <span class="meta" id="latestMeta"></span>
    </div>
    <div id="latest"><div class="state">뉴스레터를 불러오는 중입니다…</div></div>

  <section class="sec" id="yt-sec" aria-labelledby="ytTitle">

      <h2 id="ytTitle"><em>유튜브 급상승</em></h2>
      <span class="meta" id="ytMeta">최근 7일 업로드 · 조회수 순</span>
    </div>
    <div class="yt-tabs" role="tablist" aria-label="지역 선택">
      <button type="button" role="tab" id="ytTab-kr" data-region="kr" aria-selected="true">한국</button>
      <button type="button" role="tab" id="ytTab-global" data-region="global" aria-selected="false">해외</button>
    </div>
    <div id="yt"><div class="state">유튜브 급상승 영상을 불러오는 중입니다…</div></div>
  </section>

  <section class="sec" id="archive-sec" aria-labelledby="pastTitle">
    <div class="sec-head">
      <h2 id="pastTitle"><em>지난 뉴스레터</em></h2>
    </div>
    <div class="arch" id="past"></div>
  </section>
</main>

<footer>
  <div class="wrap">
    <p>*이 뉴스레터를 Email로 받고 싶다면 아래 메일로 연락주세요.</p>
    <p>*Contact: <a href="mailto:genesis93k@gmail.com">genesis93k@gmail.com</a></p>
  </div>

<script>
const CATS = [
  { id: "domestic", name: "국내 게임" },
  { id: "global", name: "해외 게임" },
  { id: "marketing", name: "이색 마케팅" },
  { id: "ai", name: "AI 기술" },
];
const CATNAME = Object.fromEntries(CATS.map((c) => [c.id, c.name]));
// 오늘의 뉴스레터는 두 묶음으로 합쳐 보여 준다
const GROUPS = [
  { id: "game", name: "국내/해외 게임", cats: ["domestic", "global"] },
  { id: "mkt", name: "이색 마케팅/AI 기술", cats: ["marketing", "ai"] },
];
const RECENT = 5;
let issues = [];
// GitHub Pages 판: 데이터는 data/issues.json, 썸네일은 thumbs/<날짜>/<n>.jpg (items[].thumbFile)
const thumbs = { loaded: true };
function watchThumbs() {}

const $ = (id) => document.getElementById(id);
function el(tag, attrs = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null) continue;
    if (k === "class") n.className = v; else if (k === "text") n.textContent = v; else n.setAttribute(k, v);
  }
  for (const k of kids) if (k != null) n.append(k);
  return n;
}
function safeUrl(u) { return /^https?:\/\//i.test(u || "") ? u : null; }
function link(url, text) {
  const u = safeUrl(url);
  return u ? el("a", { href: u, target: "_blank", rel: "noopener noreferrer", text }) : el("span", { text });
}

  next.innerHTML = '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M5.5 2.5L10 7l-4.5 4.5" fill="none" stroke="#0F0F0F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  } catch (e) {
    $("yt").replaceChildren(el("div", { class: "state", text: "유튜브 급상승 데이터를 불러오지 못했습니다. 잠시 후 새로고침해 주세요." }));
  }
})();
</script>
